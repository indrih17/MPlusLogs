name: Publish GitHub and CurseForge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mpluslogs-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.0 lupa Pillow
      - name: Prepare version and changelog
        run: python tools/prepare_ci_release.py
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Push prepared release metadata
        run: |
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source changed remotely; next queued run will release it' }
      - name: Build changed addon and Companion installer
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $companionVersion = python -c "import sys; sys.path.insert(0,'tools'); import companion_version; print(companion_version.version())"
          $existing = gh release view "companion-v$companionVersion" --json assets 2>$null
          $complete = $LASTEXITCODE -eq 0 -and "MPlusLogs-Companion-$companionVersion-Setup.exe" -in ($existing | ConvertFrom-Json).assets.name
          New-Item -ItemType Directory -Force release-output/channel-state | Out-Null
          gh release download companion-channel --pattern companion-update.json --dir release-output/channel-state --clobber 2>$null
          if ($LASTEXITCODE -eq 0) {
            $published = Get-Content release-output/channel-state/companion-update.json -Raw | ConvertFrom-Json
            $sourceHash = python -c "import sys; sys.path.insert(0,'tools'); import companion_version; print(companion_version.source_hash())"
            $complete = $complete -and $published.version -eq $companionVersion -and $published.source_hash -eq $sourceHash
          } else { $complete = $false }
          $addonVersion = python -c "import sys; sys.path.insert(0,'tools'); import addon_version; print(addon_version.version())"
          $existingAddon = gh release view "v$addonVersion" --json assets 2>$null
          $addonComplete = $LASTEXITCODE -eq 0 -and "MPlusLogs-$addonVersion.zip" -in ($existingAddon | ConvertFrom-Json).assets.name -and 'curseforge-upload.json' -in ($existingAddon | ConvertFrom-Json).assets.name
          $buildArgs = @('tools/build_release.py')
          if ($addonComplete) { $buildArgs += '--skip-addon' }
          if ($complete) { $buildArgs += '--addon-only' }
          else { $buildArgs += @('--iscc', 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          "addon=$(!$addonComplete)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Publish independent Companion and update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $companionVersion = python -c "import sys; sys.path.insert(0,'tools'); import companion_version; print(companion_version.version())"
          $companionTag = "companion-v$companionVersion"
          if (Test-Path release-output/companion-update.json) {
            gh release view $companionTag --json tagName 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $companionTag --target (git rev-parse HEAD) --title "MPlusLogs Companion $companionVersion" --notes-file packaging/RELEASE-NOTES.md --latest=false
              if ($LASTEXITCODE -ne 0) { throw 'Companion release creation failed' }
            }
            $files = Get-Item "release-output/MPlusLogs-Companion-$companionVersion-Setup.exe"
            gh release upload $companionTag $files.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Companion upload failed' }
            gh release edit $companionTag --notes-file packaging/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Companion release notes update failed' }
            $releaseCommit = git rev-parse HEAD
            gh api "repos/indrih17/MPlusLogs/git/refs/tags/$companionTag" --method PATCH -f "sha=$releaseCommit" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Companion source tag update failed' }
          } else {
            Copy-Item release-output/channel-state/companion-update.json release-output/companion-update.json
          }
          $channelInfo = gh release view companion-channel --json assets 2>$null
          $refreshChannel = $true
          if ($LASTEXITCODE -ne 0) {
            gh release create companion-channel --target (git rev-parse HEAD) --title 'MPlusLogs Companion update service' --notes 'Service channel for Companion updates. The JSON file is read automatically by Companion. For manual installation, download and run the Setup exe.' --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Update channel creation failed' }
          } elseif ('companion-update.json' -in ($channelInfo | ConvertFrom-Json).assets.name -and 'MPlusLogs-Companion-Setup.exe' -in ($channelInfo | ConvertFrom-Json).assets.name) {
            New-Item -ItemType Directory -Force release-output/channel-state | Out-Null
            gh release download companion-channel --pattern companion-update.json --dir release-output/channel-state --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Update channel verification failed' }
            $current = Get-Content release-output/channel-state/companion-update.json -Raw | ConvertFrom-Json
            $next = Get-Content release-output/companion-update.json -Raw | ConvertFrom-Json
            $refreshChannel = $current.version -ne $next.version -or $current.sha256 -ne $next.sha256
          }
          if ($refreshChannel) {
            gh release download $companionTag --pattern "MPlusLogs-Companion-$companionVersion-Setup.exe" --dir release-output --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Companion installer download failed' }
            Copy-Item "release-output/MPlusLogs-Companion-$companionVersion-Setup.exe" release-output/MPlusLogs-Companion-Setup.exe
            gh release upload companion-channel release-output/MPlusLogs-Companion-Setup.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Channel installer upload failed' }
            gh release upload companion-channel release-output/companion-update.json --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Update channel upload failed' }
          }
          gh release edit companion-channel --title 'MPlusLogs Companion update service' --notes 'Service channel for Companion updates. The JSON file is read automatically by Companion. For manual installation, download and run the Setup exe.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Update channel description failed' }
          # Remove legacy extras only after the service manifest is safely published.
          $publicAssets = (gh release view $companionTag --json assets | ConvertFrom-Json).assets.name
          if ($LASTEXITCODE -ne 0) { throw 'Companion asset inspection failed' }
          foreach ($extra in @('companion-update.json', "MPlusLogs-Companion-$companionVersion-Windows-x64.zip")) {
            if ($extra -in $publicAssets) {
              gh release delete-asset $companionTag $extra --yes
              if ($LASTEXITCODE -ne 0) { throw 'Legacy Companion asset removal failed' }
            }
          }
      - name: Publish GitHub release
        if: steps.build.outputs.addon == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source changed remotely; next queued run will release it' }
          $releaseVersion = python -c "import re,pathlib; print(re.search(r'^## Version: (.+)$',pathlib.Path('MPlusLogs.toc').read_text(),re.M)[1])"
          $releaseTag = "v$releaseVersion"
          $releaseCommit = git rev-parse HEAD
          gh release view $releaseTag --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $releaseCommit --title "MPlusLogs $releaseVersion" --notes-file packaging/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
          }
          $releaseFiles = Get-ChildItem release-output -File | Where-Object { $_.Name -eq "MPlusLogs-$releaseVersion.zip" -or $_.Name -eq 'SHA256SUMS.txt' }
          gh release upload $releaseTag $releaseFiles.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub asset upload failed' }
      - name: Publish addon to CurseForge
        if: steps.build.outputs.addon == 'true'
        shell: pwsh
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = python -c "import re,pathlib; print(re.search(r'^## Version: (.+)$',pathlib.Path('MPlusLogs.toc').read_text(),re.M)[1])"
          $releaseTag = "v$releaseVersion"
          $releaseInfo = gh release view $releaseTag --json assets | ConvertFrom-Json
          if ('curseforge-upload.json' -notin $releaseInfo.assets.name) {
            python tools/upload_curseforge.py
            if ($LASTEXITCODE -ne 0) { throw 'CurseForge upload failed' }
            gh release upload $releaseTag release-output/curseforge-upload.json
            if ($LASTEXITCODE -ne 0) { throw 'CurseForge receipt upload failed; inspect before retrying' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-results
          path: release-output/
