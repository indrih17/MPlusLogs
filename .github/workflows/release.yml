name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.0 lupa Pillow
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          from pathlib import Path
          version = re.search(r'^## Version: (.+)$', Path('MPlusLogs.toc').read_text(), re.M)[1]
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - run: python -m unittest discover -s tests -q
      - run: python tools/build_release.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MPlusLogs-release
          path: |
            release-output/*.zip
            release-output/*.exe
            release-output/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" release-output/*.zip release-output/*.exe release-output/SHA256SUMS.txt --title "MPlusLogs $env:GITHUB_REF_NAME" --notes-file packaging/RELEASE-NOTES.md
