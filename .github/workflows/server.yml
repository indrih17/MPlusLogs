name: Validate profile server Docker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa
      - name: Cache, budget and HTTP integration tests (fake WCL)
        run: |
          python -m unittest discover -s tests -p 'test_api_efficiency.py' -q
          python -m unittest discover -s tests -p 'test_profile_server.py' -q
      - name: Validate Compose files without real credentials
        env:
          WCL_CLIENT_ID: ci-fake-client
          WCL_CLIENT_SECRET: ci-fake-secret
          MPLUSLOGS_DOMAIN: profiles.example.com
        run: |
          docker compose -f server/compose.yaml config --quiet
          docker compose -f server/compose.production.yaml config --quiet
      - name: Build and start non-root read-only container
        run: |
          docker build -f server/Dockerfile -t mpluslogs-profile-test .
          docker run --detach --name mpluslogs-profile-test --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --mount type=volume,source=mpluslogs-profile-test,target=/data --env WCL_CLIENT_ID=ci-fake-client --env WCL_CLIENT_SECRET=ci-fake-secret --env MPLUSLOGS_PUBLIC_URL=http://localhost:8080 --publish 127.0.0.1:18080:8080 mpluslogs-profile-test
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
      - name: Verify persistent budget after container restart
        run: |
          docker exec mpluslogs-profile-test python -c "import sys; sys.path.insert(0,'tools'); from api_budget import Budget; b=Budget('/data/api-state.sqlite3'); b.reserve('ci-persistence'); b.close()"
          docker restart mpluslogs-profile-test
          docker exec mpluslogs-profile-test python -c "import sys; sys.path.insert(0,'tools'); from api_budget import Budget, BudgetError; b=Budget('/data/api-state.sqlite3'); assert b.snapshot()['counters']['upstream_attempts']==1; assert b._value('profile:ci-persistence')>b.clock(); b.close()"
      - name: Container diagnostics
        if: failure()
        run: docker logs mpluslogs-profile-test
      - name: Stop test container
        if: always()
        run: docker rm --force mpluslogs-profile-test || true
