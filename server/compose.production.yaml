services:
  profiles:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:?Set WCL_CLIENT_ID in server/.env}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:?Set WCL_CLIENT_SECRET in server/.env}
      MPLUSLOGS_PUBLIC_URL: https://${MPLUSLOGS_DOMAIN:?Set MPLUSLOGS_DOMAIN}
      MPLUSLOGS_ADMIN_TOKEN: ${MPLUSLOGS_ADMIN_TOKEN:-}
      MPLUSLOGS_USER_HOURLY: ${MPLUSLOGS_USER_HOURLY:-60}
      MPLUSLOGS_USER_DAILY: ${MPLUSLOGS_USER_DAILY:-300}
      MPLUSLOGS_GLOBAL_HOURLY: ${MPLUSLOGS_GLOBAL_HOURLY:-500}
      MPLUSLOGS_TRUST_PROXY: "1"
    volumes:
      - profile-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 128
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      MPLUSLOGS_DOMAIN: ${MPLUSLOGS_DOMAIN:?Set MPLUSLOGS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      profiles:
        condition: service_healthy
volumes:
  profile-data:
  caddy-data:
  caddy-config:
